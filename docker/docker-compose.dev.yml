services:
  postgres:
    container_name: cryptoobmen-postgres-dev
    restart: always
    image: postgres:17.4
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    env_file:
      - ../backend/.env.backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - cryptoobmen_network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - cryptoobmen_network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    environment:
      - POSTGRES_HOST=postgres  # Переопределяем для Docker
      - CELERY_BROKER_URL=redis://redis:6379/0  # Переопределяем для Docker
      - CELERY_RESULT_BACKEND=redis://redis:6379/0  # Переопределяем для Docker
      - REDIS_HOST=redis  # Переопределяем для Docker
      - REDIS_PORT=6379  # Переопределяем для Docker
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh   
    ports:
      - "8000:8000"
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - cryptoobmen_network

  worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    environment:
      - POSTGRES_HOST=postgres  # Переопределяем для Docker
      - CELERY_BROKER_URL=redis://redis:6379/0  # Переопределяем для Docker
      - CELERY_RESULT_BACKEND=redis://redis:6379/0  # Переопределяем для Docker
      - REDIS_HOST=redis  # Переопределяем для Docker (для CHANNEL_LAYERS)
      - REDIS_PORT=6379  # Переопределяем для Docker (для CHANNEL_LAYERS)
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      - backend
      - redis
    command: celery -A core worker -l info --pool=solo -Q high_priority,medium_priority,low_priority
    networks:
      - default
      - cryptoobmen_network

  beat:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    environment:
      - POSTGRES_HOST=postgres  # Переопределяем для Docker
      - CELERY_BROKER_URL=redis://redis:6379/0  # Переопределяем для Docker
      - CELERY_RESULT_BACKEND=redis://redis:6379/0  # Переопределяем для Docker
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      - backend
      - redis
    command: celery -A core beat -l info
    networks:
      - default
      - cryptoobmen_network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: development
    env_file:
      - ../frontend/.env.development
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/.next
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - default
      - cryptoobmen_network

networks:
  default:
  cryptoobmen_network:
    external: true

volumes:
  postgres_data_dev:
    name: cryptoobmen_postgres_data_dev

