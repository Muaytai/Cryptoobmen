services:

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    environment:
      - DJANGO_ENV=development
      - POSTGRES_DB=cryptoobmen
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=cryptoobmen-postgres
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    networks:
      - default
      - cryptoobmen_network

  worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    environment:
      - DJANGO_ENV=development
      - POSTGRES_DB=cryptoobmen
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=cryptoobmen-postgres
      - POSTGRES_PORT=5432
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      - backend
      - redis
    command: celery -A core worker -l info --pool=solo
    networks:
      - default
      - cryptoobmen_network

  beat:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../backend/.env.backend
    environment:
      - DJANGO_ENV=development
      - POSTGRES_DB=cryptoobmen
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=cryptoobmen-postgres
      - POSTGRES_PORT=5432
    volumes:
      - ../backend:/app
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      - backend
      - redis
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - default
      - cryptoobmen_network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: development
    env_file:
      - ../frontend/.env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - /app/.next
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - default
      - cryptoobmen_network

networks:
  default:
  cryptoobmen_network:
    external: true

