# Конфигурация для prootzyvy.com

# Апстримы для проекта prootzyvy
upstream prootzyvy_backend {
    server prootzyvy-backend:8000;
}

upstream prootzyvy_nextjs {
    server prootzyvy-frontend:3000;
}

# Базовый HTTP сервер для acme-challenge
server {
    listen 80;
    server_name prootzyvy.com www.prootzyvy.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS сервер
server {
    listen 443 ssl;
    server_name prootzyvy.com www.prootzyvy.com;
    server_tokens off;

    # SSL настройки
    ssl_certificate /etc/letsencrypt/live/prootzyvy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prootzyvy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Отключаем редирект для OPTIONS запросов
    if ($skip_trailing_slash_redirect = 1) {
        # Не выполняем редирект
        rewrite ^(.*[^/])$ $1/ break;
    }
    
    # Специальное правило для /api/v1/users без слеша
    location = /api/v1/users {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' $cors_headers;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Expose-Headers' 'Set-Cookie';
            add_header 'Vary' 'Origin';
            return 204;
        }
        
        proxy_pass http://prootzyvy_backend/api/v1/users/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CSRFToken $http_x_csrf_token;
        
        # Устанавливаем CORS заголовки в ответ от Nginx
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' $cors_headers always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Set-Cookie' always;
        add_header 'Vary' 'Origin' always;
        
        # Явно отключаем редиректы
        proxy_redirect off;
    }

    client_max_body_size 20M;

    # Правило для robots.txt
    location = /robots.txt {
        proxy_pass http://prootzyvy_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache";
        add_header Content-Type "text/plain; charset=UTF-8";
    }

    # Health check для API
    location = /api/v1/health {
        proxy_pass http://prootzyvy_backend/api/v1/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    
    # Health check для Next.js
    location = /api/health {
        proxy_pass http://prootzyvy_nextjs/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # Статические файлы фронтенда
    location ~ ^/(img|_next|static)/ {
        proxy_pass http://prootzyvy_nextjs;
        proxy_cache my_cache;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Отдельный блок для токенов и валидации - выше чем общий /api/v1/
    location ~ ^/api/v1/(token|users/validate) {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' $cors_headers;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Expose-Headers' 'Set-Cookie';
            add_header 'Vary' 'Origin';
            return 204;
        }
        
        proxy_cookie_path / "/; SameSite=None; Secure";
        proxy_cookie_domain prootzyvy_backend $host;
        
        proxy_pass http://prootzyvy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CSRFToken $http_x_csrf_token;
        
        # Устанавливаем CORS заголовки в ответ от Nginx
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' $cors_headers always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Set-Cookie' always;
        add_header 'Vary' 'Origin' always;
        
        # Важно: отключаем любые редиректы
        proxy_redirect off;
    }

    # API запросы
    location /api/v1/ {
        limit_req zone=one burst=5;
        limit_conn addr 10;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' $cors_headers;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Expose-Headers' 'Set-Cookie';
            add_header 'Vary' 'Origin';
            return 204;
        }
        
        proxy_cookie_path / "/; SameSite=None; Secure";
        proxy_cookie_domain prootzyvy_backend $host;
        
        proxy_pass http://prootzyvy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-CSRFToken $http_x_csrf_token;
        
        # Устанавливаем CORS заголовки в ответ от Nginx
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' $cors_headers always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Set-Cookie' always;
        add_header 'Vary' 'Origin' always;
    }

    # Django статика и медиа
    location /django_static/ {
        alias /django_static/;
        expires 30d;
        access_log off;
    }

    location /django_media/ {
        alias /django_media/;
        expires 7d;
        access_log off;
    }

    location /sitemap.xml {
        proxy_pass http://prootzyvy_nextjs;
    }

    # Все остальные запросы к Next.js
    location / {
        proxy_pass http://prootzyvy_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
} 