# Конфигурация для tkxn.org с Cloudflare

# Апстримы для проекта
upstream cryptoobmen_backend {
    server backend:8000;
}

upstream cryptoobmen_frontend {
    server frontend:3000;
}

# HTTP сервер - будет обрабатывать запросы от Cloudflare
server {
    listen 80;
    server_name tkxn.org www.tkxn.org;


    # Для проверки Let's Encrypt (certbot validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального трафика на HTTPS
    # ВНИМАНИЕ: Для получения первого сертификата временно закомментируйте этот блок
    # или используйте standalone режим certbot: certbot certonly --standalone -d tkxn.org -d www.tkxn.org
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер с Let's Encrypt сертификатами
server {
    listen 443 ssl http2;
    server_name tkxn.org www.tkxn.org;

    # Let's Encrypt сертификаты (постоянное решение)
    ssl_certificate /etc/letsencrypt/live/tkxn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tkxn.org/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Проверка клиентского сертификата Cloudflare (опционально)
    # ssl_client_certificate /etc/nginx/ssl/cloudflare/cloudflare.crt;
    # ssl_verify_client on;

    # Проксирование запросов к фронтенду (Next.js)
    location / {
        proxy_pass http://cryptoobmen_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket поддержка для фронтенда (если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Проксирование запросов авторизации через соцсети (allauth) на бэкенд
    location /accounts/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Проксирование callback после авторизации на бэкенд
    location /auth/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Проксирование API запросов на бэкенд
    location /api/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Проксирование запросов к admin панели Django
    location /admin/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket для Django Channels
    location /ws/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты для долгих WebSocket соединений
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Обслуживание статических файлов бэкенда
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Обслуживание медиа-файлов
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
