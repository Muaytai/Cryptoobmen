# Конфигурация для tkxn.org с Cloudflare

# Апстримы для проекта
upstream cryptoobmen_backend {
    server backend:8000;
}

upstream cryptoobmen_frontend {
    server frontend:3000;
}

# HTTP сервер - будет обрабатывать запросы от Cloudflare
server {
    listen 80;
    server_name tkxn.org www.tkxn.org;


    # Для проверки Let's Encrypt (если понадобится)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Проксирование запросов к фронтенду
    location / {
        proxy_pass http://cryptoobmen_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Проксирование API запросов на бэкенд
    location /api/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Проксирование запросов к admin панели Django
    location /admin/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket для Django Channels
    location /ws/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Обслуживание статических файлов бэкенда
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Обслуживание медиа-файлов
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# HTTPS сервер для Cloudflare Origin сертификатов (опционально)
server {
    listen 443 ssl http2;
    server_name tkxn.org www.tkxn.org;

    # Cloudflare Origin сертификаты
    ssl_certificate /etc/nginx/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/origin.key;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Проверка клиентского сертификата Cloudflare (опционально)
    # ssl_client_certificate /etc/nginx/ssl/cloudflare/cloudflare.crt;
    # ssl_verify_client on;

    # Проксирование запросов к фронтенду
    location / {
        proxy_pass http://cryptoobmen_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Проксирование API запросов на бэкенд
    location /api/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Проксирование запросов к admin панели Django
    location /admin/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket для Django Channels
    location /ws/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Обслуживание статических файлов бэкенда
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Обслуживание медиа-файлов
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
