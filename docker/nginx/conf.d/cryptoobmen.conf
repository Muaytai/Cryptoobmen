# Конфигурация для Cryptoobmen

# Апстримы для проекта Cryptoobmen
upstream cryptoobmen_backend {
    server crypto-backend:8000;
}

upstream cryptoobmen_frontend {
    server crypto-frontend:3000;
}

server {
    listen 80;
    server_name 194.15.46.70;

    # Редирект на HTTPS (раскомментировать, когда SSL будет настроен)
    # return 301 https://$host$request_uri;

    # Настройки для Let's Encrypt (если будет использоваться)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://cryptoobmen_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование API запросов на бэкенд
    location /api/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование запросов к admin панели Django
    location /admin/ {
        proxy_pass http://cryptoobmen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Обслуживание статических файлов бэкенда
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Обслуживание медиа-файлов
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Дополнительные настройки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options SAMEORIGIN;
}

