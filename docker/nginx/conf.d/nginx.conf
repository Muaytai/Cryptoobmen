# Общие настройки для всех сайтов

# Защита от DDoS
limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Увеличенные таймауты для предотвращения ошибок 504 Gateway Timeout
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
fastcgi_send_timeout 300s;
fastcgi_read_timeout 300s;
client_header_timeout 300s;
client_body_timeout 300s;
keepalive_timeout 300s;

# Кэширование
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

# Настройки CORS для prootzyvy.com
map $http_origin $cors_origin {
    default "";
    "https://prootzyvy.com" $http_origin;
    "https://www.prootzyvy.com" $http_origin;
    "http://prootzyvy.com" $http_origin;
    "http://www.prootzyvy.com" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
}

# Обработчик для случаев, когда Origin не передан
map $http_referer $referer_origin {
    default "";
    "~^(https?://[^/]+)" $1;
}

# Общие CORS заголовки
map $http_origin $cors_headers {
    default "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,X-CSRFToken";
}

# Отключаем редиректы на / для OPTIONS запросов
map $request_method $skip_trailing_slash_redirect {
    OPTIONS 1;
    default 0;
}

# Карта для контроля CORS заголовков
map $uri $add_cors_headers {
    default 1;
    "~^/django_static/" 0;
    "~^/django_media/" 0;
    "~^/(img|_next|static)/" 0;
}

# Добавляем определение реального IP от Cloudflare
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Включаем gzip сжатие
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript application/xml application/x-javascript text/xml text/javascript;

# Общие установки безопасности
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header X-Frame-Options SAMEORIGIN; 