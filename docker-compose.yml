services:
  # Nginx сервис для Cryptoobmen
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./static:/usr/share/nginx/static
      - ./media:/usr/share/nginx/media
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - crypto-backend
      - crypto-frontend
    restart: always
    networks:
      - cryptoobmen-network

  # PostgreSQL база данных
  postgres:
    container_name: cryptoobmen-postgres
    image: postgres:16.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./docker/postgres/.env.db
    environment:
      - POSTGRES_DB=cryptoobmen
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgresdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - cryptoobmen-network

  # Redis для кэширования и Channels
  redis:
    container_name: cryptoobmen-redis
    image: redis:7.4.3-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - cryptoobmen-network

  # Бэкенд Cryptoobmen
  crypto-backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    volumes:
      - ./backend:/app
      - ./static:/app/static
      - ./media:/app/media
    environment:
      - DEBUG=0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./docker/backend/.env.prod
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - cryptoobmen-network

  # Фронтенд Cryptoobmen
  crypto-frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    env_file:
      - ./frontend/.env.production
    restart: always
    networks:
      - cryptoobmen-network

  # Certbot для SSL сертификатов
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - cryptoobmen-network

volumes:
  postgres_data:
    name: cryptoobmen_postgres_data
  redis_data:
    name: cryptoobmen_redis_data

networks:
  cryptoobmen-network:
    name: cryptoobmen-network
    driver: bridge 