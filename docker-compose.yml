services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/tkxn.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/static
      - media_volume:/usr/share/nginx/media
    depends_on:
      - backend
      - frontend
    networks:
      - cryptoobmen_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: gunicorn core.asgi:application -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - ./backend/.env.backend
    networks:
      - cryptoobmen_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: production
    command: npm start
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    networks:
      - cryptoobmen_network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - cryptoobmen_network

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core worker -l info
    env_file:
      - ./backend/.env.backend
    depends_on:
      - backend
      - redis
    networks:
      - cryptoobmen_network

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env.backend
    depends_on:
      - backend
      - redis
    networks:
      - cryptoobmen_network

networks:
  cryptoobmen_network:
    external: true

volumes:
  static_volume:
  media_volume:
