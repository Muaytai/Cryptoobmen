services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/tkxn.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/static
      - media_volume:/usr/share/nginx/media
      - /etc/nginx/ssl/cloudflare:/etc/nginx/ssl/cloudflare:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cryptoobmen_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: gunicorn core.asgi:application -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1.5g
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cryptoobmen_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: production
    command: npm start
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cryptoobmen_network

  postgres:
    container_name: cryptoobmen-postgres
    restart: always
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env.backend
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoobmen_network

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoobmen_network

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core worker -l info -Q high_priority,medium_priority,low_priority
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 1g
    networks:
      - cryptoobmen_network

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - cryptoobmen_network

networks:
  cryptoobmen_network:
    driver: bridge
    name: cryptoobmen_network

volumes:
  static_volume:
  media_volume:
  postgres_data:
    name: cryptoobmen_postgres_data
  letsencrypt_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  letsencrypt_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/certbot
