services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/tkxn.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/static
      - media_volume:/usr/share/nginx/media
      - /etc/nginx/ssl/cloudflare:/etc/nginx/ssl/cloudflare:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cryptoobmen_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    # Количество воркеров: (2 * CPU cores) + 1
    # Для продакшена можно настроить через переменную окружения GUNICORN_WORKERS
    # По умолчанию 4 воркера, каждый может создать несколько соединений к БД
    command: gunicorn core.asgi:application -w ${GUNICORN_WORKERS:-4} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 120 --keep-alive 5
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1.5g
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cryptoobmen_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: production
    command: npm start
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - NEXT_PUBLIC_WS_URL=wss://tkxn.org/ws
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cryptoobmen_network

  postgres:
    container_name: cryptoobmen-postgres
    restart: always
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env.backend
    environment:
      # Увеличиваем лимит соединений до 200 (по умолчанию 100)
      # Расчет: 4 воркера * ~10 соединений + worker + beat + запас = ~200
      - POSTGRES_INITDB_ARGS=-c max_connections=200
    # Оптимизированные настройки для продакшена
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoobmen_network

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoobmen_network

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core worker -l info -Q high_priority,medium_priority,low_priority
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 1g
    networks:
      - cryptoobmen_network

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - cryptoobmen_network

networks:
  cryptoobmen_network:
    driver: bridge
    name: cryptoobmen_network

volumes:
  static_volume:
  media_volume:
  postgres_data:
    name: cryptoobmen_postgres_data
  letsencrypt_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  letsencrypt_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/certbot
